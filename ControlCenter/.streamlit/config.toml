[theme]
base = "dark"
primaryColor = "#45d6bb"
backgroundColor = "#0b101a"
secondaryBackgroundColor = "#151d2c"
textColor = "#e5edf5"
font = "sans serif"

[server]
address = "127.0.0.1"
headless = true
fileWatcherType = "none"
enableCORS = true
enableXsrfProtection = true

[browser]
gatherUsageStats = false
