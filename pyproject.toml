[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "market-pattern-discovery"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "pandas>=2.0", "jsonschema>=4.0"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]


[project.scripts]
bbw-backtest = "bbw_system.cli:main"
bbw-data = "bbw_system.data_cli:main"
bbw-normalize = "bbw_system.normalization_cli:main"
bbw-engine = "bbw_system.bbw_engine_cli:main"
bbw-baseline = "bbw_system.baseline_cli:main"
bbw-baseline-diagnostics = "bbw_system.baseline_diagnostics_cli:main"
bbw-optimize = "bbw_system.bbw_optimization_cli:main"
bbw-optimize-r2 = "bbw_system.bbw_optimization_r2_cli:main"
bbw-robustness = "bbw_system.robustness_cli:main"
bbw-compliance = "bbw_system.bbw_compliance_cli:main"
bbw-trade-management-audit = "bbw_system.trade_management_audit.cli:main"
bbw-core-execution = "bbw_system.core_execution_cli:main"
phase1b-validate = "market_pattern_discovery.validation.phase1b:main"
phase2a-validate = "market_pattern_discovery.validation.phase2a:main"
phase2b-validate = "market_pattern_discovery.validation.phase2b:main"
phase2c-validate = "market_pattern_discovery.validation.phase2c:main"
phase3a-validate = "market_pattern_discovery.validation.phase3a:main"
phase3b-validate = "market_pattern_discovery.validation.phase3b:main"
phase3c-validate = "market_pattern_discovery.validation.phase3c:main"
phase4a-validate = "market_pattern_discovery.validation.phase4a:main"
phase4b-validate = "market_pattern_discovery.validation.phase4b:main"
phase5a-validate = "market_pattern_discovery.validation.phase5a:main"
phase5a1-validate = "market_pattern_discovery.validation.phase5a1:main"
phase5a2-validate = "market_pattern_discovery.validation.phase5a2:main"
multihorizon-research = "market_pattern_discovery.orchestration.multihorizon:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["market_pattern_discovery*", "bbw_system*"]
