name: V20-08 minimal LIVE offline Windows check

on:
  pull_request:
    paths:
      - 'V20_TradingSystem_M15/v20_runtime/**'
      - 'V20_TradingSystem_M15/V20-08/v20-08-live-*.ps1'
      - '.github/workflows/v20-08-live-windows.yml'
  push:
    branches:
      - codex/v20-04-all-three-offline-foundation-20261021
    paths:
      - 'V20_TradingSystem_M15/v20_runtime/**'
      - '.github/workflows/v20-08-live-windows.yml'

permissions:
  contents: read

jobs:
  native-offline:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Checkout (no persisted credentials)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Python 3.12.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          architecture: x64
      - name: Install test-only numerical packages
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check numpy==2.2.6 pandas==2.3.3 tzdata==2025.2
          exit $LASTEXITCODE
      - name: PowerShell syntax only for new V20 install launcher and cutover
        shell: pwsh
        run: |
          $scripts = @('V20_TradingSystem_M15/V20-08/v20-08-live-prep.ps1', 'V20_TradingSystem_M15/V20-08/v20-08-live-launch.ps1', 'V20_TradingSystem_M15/V20-08/v20-08-live-cutover.ps1', 'V20_TradingSystem_M15/V20-08/v20-08-live-operator.ps1', 'V20_TradingSystem_M15/V20-08/v20-08-finam-read-recovery.ps1')
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path -LiteralPath $script).Path, [ref]$tokens, [ref]$errors)
            if (@($errors).Count -ne 0) { Write-Error ('V20_PS_PARSE_FAILED ' + $script); exit 1 }
          }
          Write-Output 'V20_08_5_POWERSHELL_PARSE=PASS_5_OF_5_NO_EXECUTION'
      - name: SQLite snapshot via Windows PowerShell 5.1 native invocation
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $operator = Get-Content -LiteralPath 'V20_TradingSystem_M15/V20-08/v20-08-live-operator.ps1' -Raw
          $pattern = '(?s)\$code=@''\r?\n(?<source>.*?)\r?\n''@'
          $match = [regex]::Match($operator, $pattern)
          if (-not $match.Success) { throw 'V20_08_5_BACKUP_SOURCE_MISSING' }
          $folder = Join-Path $env:RUNNER_TEMP 'v20-ps51-sqlite'
          New-Item -ItemType Directory -Path $folder -Force | Out-Null
          $helper = Join-Path $folder 'backup.py'
          $maker = Join-Path $folder 'make.py'
          $source = Join-Path $folder 'source.sqlite3'
          $copy = Join-Path $folder 'copy.sqlite3'
          [io.file]::WriteAllText($helper, $match.Groups['source'].Value, [text.utf8encoding]::new($false))
          $fixture = @'
          import json, sqlite3, sys
          with sqlite3.connect(sys.argv[1]) as db:
              db.execute("CREATE TABLE state (key TEXT PRIMARY KEY, value TEXT)")
              db.execute("INSERT INTO state VALUES (?,?)", ("database_identity", json.dumps({"synthetic": True})))
          '@
          [io.file]::WriteAllText($maker, $fixture, [text.utf8encoding]::new($false))
          & python -B $maker $source
          if ($LASTEXITCODE -ne 0) { throw 'V20_08_5_FIXTURE_FAILED' }
          & python -B $helper $source $copy
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $copy)) { throw 'V20_08_5_NATIVE_PS51_BACKUP_FAILED' }
          Write-Output 'V20_08_5_BACKUP_NATIVE_WINDOWS_POWERSHELL_51=PASS'
      - name: Regression - recovery uses pinned fixed operator BEFORE SQLite backup
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $recovery = Get-Content -LiteralPath 'V20_TradingSystem_M15/V20-08/v20-08-finam-read-recovery.ps1' -Raw
          $operator = 'V20_TradingSystem_M15/V20-08/v20-08-live-operator.ps1'
          # v3 recovery remains an immutable pinned release; the CHECK-only
          # operator can evolve independently without rewriting old recovery.
          $recoveryOperatorBlob = 'e0fd05423899a02fee5861a176b0f72f7ee3bf5c'
          if ($recovery -notmatch [regex]::Escape("$"+"newOperator='"+$recoveryOperatorBlob+"'")) { throw 'V20_08_5_PREBACKUP_PIN_CHANGED' }
          if ($recovery.Contains('-file $operator -mode backup')) { throw 'V20_08_5_PREBACKUP_STALE_OPERATOR_USED' }
          $steps = @(
            '$backupOperator=Join-Path',
            'hash $backupOperator',
            '-file $backupOperator -mode backup',
            'patch-file ([string]$pair[0])'
          )
          $before = -1
          foreach ($step in $steps) {
            $offset = $recovery.IndexOf($step, $before+1, [StringComparison]::Ordinal)
            if ($offset -le $before) { throw ('V20_08_5_PREBACKUP_ORDER_FAIL '+$step) }
            $before = $offset
          }
          $fixed = Get-Content -LiteralPath $operator -Raw
          if ($fixed.Contains('& $python -B -c $code')) { throw 'V20_08_5_PREBACKUP_PYTHON_C_REGRESSION' }
          if (-not $fixed.Contains('& $python -B $helper $sourceDb $targetDb')) { throw 'V20_08_5_PREBACKUP_PYTHON_HELPER_MISSING' }
          Write-Output 'V20_08_5_RECOVERY_PREBACKUP_PIN_AND_ORDER=PASS'
      - name: Operator CHECK on real-shaped JSONL (Windows PowerShell 5.1, no live access)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Get-Content -LiteralPath 'V20_TradingSystem_M15/V20-08/v20-08-live-operator.ps1' -Raw
          $s = $source.IndexOf('function cycle-result(', [StringComparison]::Ordinal)
          $e = $source.IndexOf('function await-cycle(', $s, [StringComparison]::Ordinal)
          if ($s -lt 0 -or $e -le $s) { throw 'CHECK_FUNCTIONS_MISSING' }
          function need([bool]$ok,[string]$code) { if (-not $ok) { throw $code } }
          function exact-task([string]$name) { return [pscustomobject]@{ State='Running' } }
          . ([scriptblock]::Create($source.Substring($s,$e-$s)))
          $expect=@{
            WAIT_NEXT_M15_OPEN='PASS'
            NO_FROZEN_SIGNAL='PASS'
            BROKER_RECONCILED_PROTECTION_PASS='PASS'
            STOP_EXECUTED_FLAT='PASS'
            ENTRY_ACK_AWAIT_BROKER_FILL='PENDING'
            STOP_ACK_NEEDS_BROKER_PROOF='PENDING'
            HALTED_NO_NEW_ENTRIES='HALTED'
            FAULT_FinamServerError='FAIL'
            HALT_V20_LIVE_UNOWNED_BROKER_POSITION='FAIL'
            UNEXPECTED='UNKNOWN'
          }
          foreach ($state in $expect.Keys) {
            $actual=cycle-result $state
            if ($actual -ne $expect[$state]) { throw ('CHECK_STATUS_WRONG '+$state+' '+$actual) }
          }
          $root=Join-Path $env:RUNNER_TEMP 'V20Lab'
          $base=Join-Path $root 'robots\shallow'
          $log=Join-Path $base 'logs\live-m15.jsonl'
          $switch=Join-Path $base 'safety\stage8-trading-kill-switch.json'
          New-Item -ItemType Directory -Path (Split-Path $log) -Force | Out-Null
          New-Item -ItemType Directory -Path (Split-Path $switch) -Force | Out-Null
          '{"state":"ARMED"}' | Set-Content -LiteralPath $switch -Encoding UTF8
          $rows=@(for($i=0;$i -lt 10;$i++){
            @{ utc=[datetimeoffset]::UtcNow.AddSeconds(-($i+1)).ToString('o')
               robot='v20-shallow';state='WAIT_NEXT_M15_OPEN' } | ConvertTo-Json -Compress
          })
          $rows | Set-Content -LiteralPath $log -Encoding UTF8
          $lines=@(proof 'v20-shallow' $true)
          $joined=$lines -join '|'
          if($joined -notmatch 'v20_08_5_v20-shallow_cycle=PASS' -or
             $joined -notmatch 'v20_08_5_v20-shallow_healthy=True' -or
             $joined -notmatch 'v20_08_5_v20-shallow_cycle_attempts_logged=10' -or
             $joined -notmatch 'v20_08_5_v20-shallow_cycle_01=status=PASS code=NONE' -or
             $joined -notmatch 'v20_08_5_v20-shallow_last_cycle_attempts_found=10' -or
             $joined -match 'WAIT_NEXT_M15_OPEN' -or
             $lines -contains 'True') { throw ('CHECK_H1_STYLE_PASS_REGRESSION '+$joined) }
          $rows[9]=(@{utc=[datetimeoffset]::UtcNow.ToString('o');robot='v20-shallow';state='FAULT_FinamServerError'} | ConvertTo-Json -Compress)
          $rows | Set-Content -LiteralPath $log -Encoding UTF8
          $failed=@(proof 'v20-shallow' $true) -join '|'
          if($failed -notmatch 'v20_08_5_v20-shallow_cycle=FAIL' -or
             $failed -notmatch 'v20_08_5_v20-shallow_healthy=False' -or
             $failed -notmatch 'code=FAULT_FinamServerError') { throw ('CHECK_FAIL_HIDDEN '+$failed) }
          Write-Output 'V20_08_5_CHECK_H1_STYLE_REAL_LOG_PASS_AND_FAIL=PASS_NO_BROKER'
      - name: Only new V20 LIVE syntax and scoped mock tests
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m py_compile V20_TradingSystem_M15/v20_runtime/finam_live.py V20_TradingSystem_M15/v20_runtime/finam_execution.py V20_TradingSystem_M15/v20_runtime/tests/test_finam_live.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest -v V20_TradingSystem_M15.v20_runtime.tests.test_finam_live V20_TradingSystem_M15.v20_runtime.tests.test_finam_protected_recovery V20_TradingSystem_M15.v20_runtime.tests.test_obv_settled_post_recovery V20_TradingSystem_M15.v20_runtime.tests.test_three_protected_post_recovery V20_TradingSystem_M15.v20_runtime.tests.test_h1_live_parity
          exit $LASTEXITCODE
