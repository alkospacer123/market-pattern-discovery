name: Top5 V4 focused tests
on:
  push:
    branches: [top5-v4-test-temp]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e .
      - name: Compile V4
        run: python -m compileall -q src/market_pattern_discovery/backtest/top5_v4 src/market_pattern_discovery/data/finam_v4.py scripts/run_top5.py
      - name: Focused V4 tests
        run: python -m pytest -q tests/test_top5_v4_engine.py tests/test_top5_v4_state_machines.py tests/test_top5_v4_governance.py
