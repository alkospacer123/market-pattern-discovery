name: Top5 V4 exact repo package
on:
  push:
    branches: [top5-v4-runtime-temp]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout exact working V4 branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin top5-contract-fix-v4
          git checkout -B top5-contract-fix-v4 origin/top5-contract-fix-v4
          git status --porcelain
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/top5-contract-fix-v4)"
          git bundle create /tmp/top5-v4-current.bundle HEAD
          tar --exclude=.git -czf /tmp/top5-v4-current.tar.gz .
      - name: Upload exact repo
        uses: actions/upload-artifact@v4
        with:
          name: top5-v4-current-full-repo
          path: |
            /tmp/top5-v4-current.bundle
            /tmp/top5-v4-current.tar.gz
          if-no-files-found: error
          compression-level: 0
