name: Top5 V4 frozen engine package
on:
  push:
    branches: [top5-v4-runtime-temp]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package exact frozen engine files
        uses: actions/upload-artifact@v4
        with:
          name: top5-v4-engine-e2
          path: |
            config/top5_v4
            src/market_pattern_discovery/backtest/top5_v4
            src/market_pattern_discovery/data/finam_v4.py
            scripts/run_top5.py
            AGENTS.md
            config/research_protocol_v1.json
          if-no-files-found: error
          compression-level: 0
