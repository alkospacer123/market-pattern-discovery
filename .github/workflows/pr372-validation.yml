name: PR372 validation

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr372-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  stage8:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest
      - name: Targeted attempt2 recovery and attempt3 tests
        run: |
          python -m pytest -q --maxfail=1 \
            TradingSystemLab/stage8_robot/tests/test_stage8_11_attempt2_manual_recovery.py \
            TradingSystemLab/stage8_robot/tests/test_stage8_11_attempt3.py \
            TradingSystemLab/stage8_robot/tests/test_controlled_real_acceptance_finam_integration.py
      - name: Stage8 audit
        run: python TradingSystemLab/stage8_robot/audit_stage8.py --check-only
      - name: Final operational audit
        run: python TradingSystemLab/stage8_robot/final_operational_audit.py --check-only
      - name: Full Stage8 suite
        run: python -m pytest -q --maxfail=1 TradingSystemLab/stage8_robot/tests
