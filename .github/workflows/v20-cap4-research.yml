name: V20 cap4 OFFLINE research only
on:
  push:
    branches:
      - research/v20-cap4-offline-20261103
    paths:
      - '.github/workflows/v20-cap4-research.yml'
      - 'V20_TradingSystem_M15/V20-04/research_cap4.py'
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Install research libraries
        run: python -m pip install --disable-pip-version-check numpy==2.2.6 pandas==2.3.3 numba==0.61.2
      - name: Retrieve four SHA-pinned offline N4 CSVs
        run: python -m V20_TradingSystem_M15.v20_runtime.prepare_n4_quotes --output "${RUNNER_TEMP}/v20cap4"
      - name: Exact frozen baseline 2 versus candidate 4
        env:
          NUMBA_NUM_THREADS: '2'
          PYTHONUNBUFFERED: '1'
        run: python V20_TradingSystem_M15/V20-04/research_cap4.py "${RUNNER_TEMP}/v20cap4" "${RUNNER_TEMP}/v20cap4-results.json"
      - name: Research outputs summary (no trade actions)
        if: success()
        run: |
          python -c 'import json,os; p=os.path.join(os.environ["RUNNER_TEMP"],"v20cap4-results.json"); r=json.load(open(p)); print("CAP4_PARITY_FINAL="+str(r["valid_frozen_baseline"])); print("CAP4_SOURCE_SCOPE="+json.dumps(r["quote_scope"],separators=(",",":"))); print("CAP4_REPORT_SHA256="+__import__("hashlib").sha256(open(p,"rb").read()).hexdigest())'
