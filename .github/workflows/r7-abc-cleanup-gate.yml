name: R7 A-B-C immutable cleanup and native symlink guard

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'IntradayLab/optimization_a_2023_v1/**'
      - 'IntradayLab/optimization_b_high_low_cluster_2023_v1/**'
      - 'IntradayLab/optimization_c_return_retest_rejection_2023_v1/**'
      - 'IntradayLab/results/optimization_a_equal_high_low_2023_v1/**'
      - 'IntradayLab/results/optimization_b_high_low_cluster_2023_v1/**'
      - 'IntradayLab/results/optimization_c_return_retest_rejection_2023_v1/**'
      - '.github/workflows/r7-abc-cleanup-gate.yml'

permissions:
  contents: read

jobs:
  immutable-tree-and-symlink:
    if: github.event.pull_request.base.ref == 'main'
    name: Exact Git scope + native symlink (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      R7_PR_SHA: ${{ github.event.pull_request.head.sha }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Immutable PR head and shallow tree objects only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, SHA-pinned
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 3
          filter: blob:none
          sparse-checkout: |
            /.github/workflows/
            /ControlCenter/controller/
          sparse-checkout-cone-mode: false
      - name: Python 3.12.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, SHA-pinned
        with:
          python-version: '3.12.10'
      - name: Check exact A/B/C removals, CC source identity and real symlink denial
        run: |
          python -B - <<'PY'
          import collections
          import os
          from pathlib import Path
          import subprocess
          import tempfile
          import sys

          PIN = 'f15d565755b996252081ed49ed5a094ee1e8d820'
          DELETION_COMMIT = '20e5e0f23adbf9422c3dd8e6d1290bcd90340560'
          DELETION_TREE = '47a8bc791f13601530d1046bfe3cb87683fd1632'
          CI_FILE = '.github/workflows/r7-abc-cleanup-gate.yml'
          CC_TREE = '8052938c83a27b2367309052d455d74d9341df09'
          JOURNAL_BLOB = '5c620431d30242dbb4cb418fd2d7c5cf33b2ade9'
          EXPECTED = {
              'IntradayLab/optimization_a_2023_v1/': 19,
              'IntradayLab/optimization_b_high_low_cluster_2023_v1/': 23,
              'IntradayLab/optimization_c_return_retest_rejection_2023_v1/': 24,
              'IntradayLab/results/optimization_a_equal_high_low_2023_v1/': 1174,
              'IntradayLab/results/optimization_b_high_low_cluster_2023_v1/': 7053,
              'IntradayLab/results/optimization_c_return_retest_rejection_2023_v1/': 3198,
          }

          def git(*args):
              return subprocess.check_output(['git', *args], stderr=subprocess.PIPE)

          def tree(rev):
              files = {}
              for line in git('ls-tree', '--full-tree', '-r', '-z', rev).split(b'\0'):
                  if not line:
                      continue
                  metadata, name = line.split(b'\t', 1)
                  if name in files:
                      raise RuntimeError('DUPLICATE_GIT_TREE_PATH')
                  files[name] = metadata
              return files

          def exact(name):
              return git('rev-parse', name).decode().strip()

          assert exact('HEAD') == os.environ['R7_PR_SHA'], 'UNEXPECTED_PR_HEAD'
          assert exact('HEAD^') == DELETION_COMMIT, 'DELETE_PARENT_MOVED'
          assert exact('HEAD^^') == PIN, 'ORIGINAL_MAIN_PIN_MOVED'
          assert exact('HEAD^{tree}') != DELETION_TREE, 'CI_WORKFLOW_NOT_COMMITTED'
          assert exact(DELETION_COMMIT + '^{tree}') == DELETION_TREE, 'VERIFIED_DELETE_TREE_MOVED'
          assert exact('HEAD:ControlCenter') == CC_TREE, 'CONTROL_CENTER_TREE_CHANGED'
          assert exact('HEAD:ControlCenter/controller/v20_offline_journal.py') == JOURNAL_BLOB, 'JOURNAL_BLOB_CHANGED'
          a, b = tree(PIN), tree('HEAD')
          removed, added = set(a) - set(b), set(b) - set(a)
          modified = {x for x in a.keys() & b.keys() if a[x] != b[x]}
          assert added == {CI_FILE.encode()}, 'EXTRA_ADDITIONS:' + str(sorted(added)[:8])
          assert not modified, 'MODIFIED_RETAINED:' + str(sorted(modified)[:8])
          counts = collections.Counter()
          for name in removed:
              decoded = name.decode('utf-8', 'surrogateescape')
              labels = [key for key in EXPECTED if decoded.startswith(key)]
              assert len(labels) == 1, 'UNAUTHORIZED_DELETE:' + decoded
              counts[labels[0]] += 1
          assert dict(counts) == EXPECTED, 'WRONG_DELETION_COUNTS:' + repr(dict(counts))
          assert len(removed) == 11491, 'WRONG_DELETE_TOTAL'
          assert len(b) == 6949, 'WRONG_RETAINED_COUNT'
          print('R7_GIT_SCOPE=PASS', 'deleted=11491', 'retained_original=6948', 'ci_only_additions=1')

          # Only disposable files in hosted runner temp; never source DBs or LIVE.
          from ControlCenter.controller.v20_offline_journal import OfflineJournal, DB_NAME
          with tempfile.TemporaryDirectory(prefix='r7-symlink-', dir=os.environ['RUNNER_TEMP']) as scratch:
              root = Path(scratch)
              source = root / 'fixture.sqlite3'
              payload = b'R7_SYMLINK_FIXTURE_ONLY_NOT_A_REAL_DB'
              source.write_bytes(payload)
              journal = root / 'journal'
              journal.mkdir()
              link = journal / DB_NAME
              try:
                  link.symlink_to(source)
              except (OSError, NotImplementedError) as exc:
                  raise RuntimeError('HOLD_NATIVE_SYMLINK_CREATE:' + repr(exc)) from exc
              assert link.is_symlink(), 'SYMLINK_NOT_CREATED'
              try:
                  OfflineJournal(journal)
              except ValueError as exc:
                  assert str(exc) == 'CC07_AUDIT_SYMLINK_FORBIDDEN', 'WRONG_JOURNAL_REFUSAL:' + str(exc)
              else:
                  raise AssertionError('JOURNAL_ACCEPTED_SYMLINK')
              assert source.read_bytes() == payload, 'SYMLINK_TARGET_MUTATED'
              realdir = root / 'real-dir'
              realdir.mkdir()
              linkdir = root / 'linked-dir'
              try:
                  linkdir.symlink_to(realdir, target_is_directory=True)
              except (OSError, NotImplementedError) as exc:
                  raise RuntimeError('HOLD_NATIVE_DIRECTORY_SYMLINK_CREATE:' + repr(exc)) from exc
              assert linkdir.is_symlink(), 'DIRECTORY_SYMLINK_NOT_CREATED'
              try:
                  OfflineJournal(linkdir)
              except ValueError as exc:
                  assert str(exc) == 'CC07_AUDIT_DIRECTORY_INVALID', 'WRONG_DIRECTORY_REFUSAL:' + str(exc)
              else:
                  raise AssertionError('JOURNAL_ACCEPTED_DIRECTORY_SYMLINK')
              assert source.read_bytes() == payload, 'TEST_SOURCE_MUTATED'
          print('R7_NATIVE_OFFLINE_JOURNAL_SYMLINK=PASS', 'os='+sys.platform)
          PY
