name: ControlCenter docs - immutable source and safe links

# Exact scope and source admission for the post-R7 V20 panel.
# Only the three explicitly reviewed active-source paths may evolve in this route.
# Historical deployment manifest remains frozen; active SOURCE is NOT a release.
# Frozen CC-03 original remains governed by its own UNMODIFIED native suite.
on:
  pull_request:
    paths:
      - 'ControlCenter/**'
      - '.github/workflows/controlcenter-docs-only.yml'
      - '.github/workflows/controlcenter-cc03-windows-native.yml'

permissions:
  contents: read

jobs:
  cc-documents-no-live:
    name: CC docs scope, immutable CC03/runtime blobs and internal links
    outputs:
      scope: ${{ steps.scope.outputs.mode }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PR_HEAD: ${{ github.event.pull_request.head.sha }}
      PR_BASE: ${{ github.event.pull_request.base.sha }}
      FROZEN_COMMIT: 0e569be6cb3c7cce1f7224e7f1fef6be38f6ba52
      FROZEN_CC_TREE: 8052938c83a27b2367309052d455d74d9341df09
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact PR source for tree checks only (no credential)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /ControlCenter/
            /.github/workflows/

      - name: Diff-safe docs and active source allowlist, immutable history, links, privacy
        id: scope
        shell: bash
        run: |
          python3 -B - <<'PY'
          import os, posixpath, re, subprocess

          def git(*args):
              return subprocess.check_output(('git',)+args, stderr=subprocess.PIPE).decode().strip()

          head=os.environ['PR_HEAD']
          base=os.environ['PR_BASE']
          frozen=os.environ['FROZEN_COMMIT']
          assert git('rev-parse','HEAD')==head, 'CC_DOCS_WRONG_HEAD'
          assert git('rev-parse',f'{frozen}:ControlCenter')==os.environ['FROZEN_CC_TREE'], 'CC_FROZEN_REFERENCE_CHANGED'

          sealed={
              'ci/protected-main-tree.json':'ff07b592289d975fe644a79f9d1d32f32a003d7a',
              'ci/scope_audit.py':'8ad3656a707a1278685927f77c9055e5bff2a8dc',
              'deployment/manifest.json':'7cd99f68f930f64ef74f17d50f6510fcd7f96691',
              'controller/v20_offline_journal.py':'5c620431d30242dbb4cb418fd2d7c5cf33b2ade9',
          }
          for p,sha in sealed.items():
              assert git('rev-parse',f'{frozen}:ControlCenter/{p}')==sha, 'CC_FROZEN_BLOB_CHANGED:'+p

          def doc_allowed(p):
              if p=='ControlCenter/README.md': return True
              if re.fullmatch(r'ControlCenter/docs/V20_[^/]+\.md',p): return True
              return p in {
                  'ControlCenter/STATUS.md',
                  'ControlCenter/JOURNAL.md',
                  'ControlCenter/docs/ARCHITECTURE.md',
                  'ControlCenter/docs/SECURITY_BOUNDARY.md',
                  'ControlCenter/docs/ROADMAP_STATUS.md',
              }
          active_source={
              'ControlCenter/cc/v20_contract.py',
              'ControlCenter/v20_app.py',
              'ControlCenter/tests/test_v20_control_center.py',
          }
          workflows={
              '.github/workflows/controlcenter-cc03-windows-native.yml',
              '.github/workflows/controlcenter-docs-only.yml',
          }
          admission='.github/workflows/r7-abc-cleanup-gate.yml'
          ci_pair={'.github/workflows/controlcenter-docs-only.yml',admission}
          # Explicit cross-project documentation allowlist (reviewed COC package).
          # No general recovery/**, Markdown wildcard, runtime or workflow exemption.
          coc_paths={
              'AGENTS.md',
              'ControlCenter/docs/V20_CC07_COMMAND_CONTRACT.md',
              'ControlCenter/docs/V20_START_HERE_SOURCE_MAP.md',
              'TradingResearchLab/reports/TRL-NOV-2026-KIMI-START-HERE.md',
              'TradingResearchLab/research/RESEARCH_METHODOLOGY.md',
              'V20_TradingSystem_M15/AGENTS.md',
              'V20_TradingSystem_M15/KIMI_START_HERE_R088.md',
              'recovery/CRITICAL_OPERATIONS_CONTRACT.md',
              'recovery/CRITICAL_OPERATIONS_INTEGRATION_MANIFEST.json',
              'recovery/DOCUMENTATION_AUTHORITY_2026-11-22.md',
              'recovery/kimi/CONTROL_CENTER.md',
              'recovery/kimi/EXAM_AND_HANDOFF.md',
              'recovery/kimi/README.md',
              'recovery/kimi/TRL.md',
              'recovery/kimi/V20.md',
          }
          skill_projects={
              'ai-engineering-handoff':('ControlCenter','TRL','V20'),
              'cc-incident-audit':('ControlCenter',),
              'github-source-audit':('ControlCenter','TRL','V20'),
              'trl-repro-review':('TRL',),
              'v20-safety-analysis':('V20',),
          }
          for skill,projects in skill_projects.items():
              coc_paths.add(f'recovery/kimi/skills/{skill}/SKILL.md')
              for project in projects:
                  coc_paths.add(f'recovery/kimi/memory/{project}/skills/{skill}/SKILL.md')
          assert len(coc_paths)==29, 'CC_COC_ALLOWLIST_COUNT'
          # Exact additional C3 draft #608 paths at reviewed head 699c231d0bc4.
          # A/M regular blobs only; no generic documentation or deletion exemption.
          c3_paths={
              'ControlCenter/JOURNAL.md',
              'ControlCenter/STATUS.md',
              'ROADMAP.md',
              'V20_TradingSystem_M15/JOURNAL.md',
              'V20_TradingSystem_M15/STATUS.md',
              'recovery/JOURNAL.md',
              'recovery/STATUS.md',
              'recovery/kimi/KIMI_DEFECTS_AND_REMEDIATION_REGISTER.md',
              'recovery/kimi/Trading_Systems_Architecture_and_AI_Collaboration.md',
              'recovery/kimi/memory/ControlCenter/MANIFEST.json',
              'recovery/kimi/memory/ControlCenter/README.md',
              'recovery/kimi/memory/ControlCenter/Trading_Systems_Architecture_and_AI_Collaboration.md',
              'recovery/kimi/memory/README.md',
              'recovery/kimi/memory/TRL/MANIFEST.json',
              'recovery/kimi/memory/TRL/README.md',
              'recovery/kimi/memory/TRL/Trading_Systems_Architecture_and_AI_Collaboration.md',
              'recovery/kimi/memory/V20/MANIFEST.json',
              'recovery/kimi/memory/V20/README.md',
              'recovery/kimi/memory/V20/Trading_Systems_Architecture_and_AI_Collaboration.md',
          }
          assert len(c3_paths)==19 and not c3_paths & coc_paths, 'CC_C3_ALLOWLIST_COUNT'
          # Final reviewed C3 documentation paths; no wildcard.
          c3_final_paths={
              'ControlCenter/docs/V20_DATA_SECURITY_TESTS.md',
              'ControlCenter/docs/V20_HEALTH_EXPOSURE_FIX_20261126.md',
              'TradingResearchLab/AGENTS.md',
              'TradingResearchLab/OPERATING_CYCLE.md',
              'TradingResearchLab/STATUS.md',
              'TradingResearchLab/journal/2026-11-27-trl-knowledge-consolidation.md',
              'TradingResearchLab/research/RESEARCH_CARD_TEMPLATE.md',
              'recovery/PROJECT_PASSPORT_CONTROL_CENTER.md',
              'recovery/PROJECT_PASSPORT_TRL.md',
              'recovery/PROJECT_PASSPORT_V20.md',
              'recovery/kimi/WINDOWS_WORKSPACE_AND_ACCESS.md',
          }
          assert len(c3_final_paths)==11 and not c3_final_paths & (coc_paths|c3_paths), 'CC_C3_FINAL_ALLOWLIST_COUNT'
          cross_project_docs=coc_paths|c3_paths|c3_final_paths
          # Exact retirement inventory, NOT owner permission to delete. Only complete
          # 29-file retirement in descendant of the reviewed draft; base and old blobs pinned.
          c3_retire={
              'recovery/kimi/memory/V20/Trading_Systems_Architecture_and_AI_Collaboration.md':('66325ca5e9264bf449cc73e9a6bfc2bd42a16db0','ddc333b21c73e6dc6f841231113c9d844dc665a6','recovery/kimi/Trading_Systems_Architecture_and_AI_Collaboration.md'),
              'recovery/kimi/memory/V20/PROJECT_PASSPORT_V20.md':('433e9ebeed832f3b4684046f11c8f6df8952e24f','433e9ebeed832f3b4684046f11c8f6df8952e24f','recovery/PROJECT_PASSPORT_V20.md'),
              'recovery/kimi/memory/V20/V20.md':('2e3db9670a79ac3219e832156b843daeb3bcbc83','2e3db9670a79ac3219e832156b843daeb3bcbc83','recovery/kimi/V20.md'),
              'recovery/kimi/memory/V20/R088_ARCHITECTURE_AND_SAFETY_20261122.md':('376c0342b1bbbe50aaeb24cff959c0f37b1fd648','376c0342b1bbbe50aaeb24cff959c0f37b1fd648','V20_TradingSystem_M15/R088_ARCHITECTURE_AND_SAFETY_20261122.md'),
              'recovery/kimi/memory/V20/LIVE_RELEASE_R088_20261120_RU.md':('641793d28566e0dfe81916a061f5cc92a35f12f0','641793d28566e0dfe81916a061f5cc92a35f12f0','V20_TradingSystem_M15/V20-08/LIVE_RELEASE_R088_20261120_RU.md'),
              'recovery/kimi/memory/V20/skills/v20-safety-analysis/SKILL.md':('81880e77f97977c3067e923a8516ce52382475eb','81880e77f97977c3067e923a8516ce52382475eb','recovery/kimi/skills/v20-safety-analysis/SKILL.md'),
              'recovery/kimi/memory/V20/skills/github-source-audit/SKILL.md':('320f3b558cee14b195ae0e8beb6ad392106f9359','320f3b558cee14b195ae0e8beb6ad392106f9359','recovery/kimi/skills/github-source-audit/SKILL.md'),
