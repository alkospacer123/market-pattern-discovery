          def read(p,expected):
              assert tree[p]==('100644','blob',expected), ('C3_IDENTITY',p)
              data=git('cat-file','blob',expected)
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==expected
              assert not data.startswith(b'version https://git-lfs.github.com/spec/v1')
              assert len(data)<=2000000
              data.decode('utf-8')
              # Obvious secret screening only, not full privacy certification.
              assert not re.search(rb'-----BEGIN (?:RSA |EC |OPENSSH |DSA |ENCRYPTED )?PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}|sk-[A-Za-z0-9_-]{30,}|Authorization:\s*Bearer\s+[A-Za-z0-9_-]{35,}',data,re.I), ('C3_POSSIBLE_SECRET',p)
              return data
          mirrors={x['p'] for x in rows}
          assert len(mirrors)==29
          assert sum(x['copy']==x['sourceBlob'] for x in rows)==18
          entries={}
          files=[]
          def add(name,source,ref,oid,data):
              assert name not in entries
              entries[name]=data
              files.append(dict(path=name,source=source,ref=ref,blob=oid,sha256=hashlib.sha256(data).hexdigest(),size=len(data)))
          for p in selected:
              add('current/'+p,p,head,tree[p][2],read(p,tree[p][2]))
          for x in rows:
              data=read(x['p'],x['copy'])
              assert tree[x['source']]==('100644','blob',x['sourceBlob'])
              if x['copy']!=x['sourceBlob']:
                  add('historical/'+x['pin']+'/'+x['source'],x['source'],x['pin'],x['copy'],data)
          assert len([p for p in entries if p.startswith('historical/')])==11
          tokens=sorted(set(['recovery/kimi/memory','kimi/memory','memory/V20','memory/ControlCenter','memory/TRL','recovery/kimi/skills','ai-engineering-handoff','github-source-audit','v20-safety-analysis','cc-incident-audit','trl-repro-review']+[p.rsplit('/',1)[-1] for p in mirrors]+list(mirrors)))
          args=['grep','-I','-n','-z','-F','--no-textconv']
          for token in tokens: args+=['-e',token]
          raw=git(*args,head,'--',ok=(0,1))
          matches=[]; counts=collections.Counter()
          linkpat=re.compile(r'!?\[[^\]\n]*\]\(\s*(<[^>\n]+>|[^\s)]+)|^\s*\[[^\]\n]+\]:\s*(<[^>\n]+>|\S+)')
          def target(path,raw):
              val=urllib.parse.unquote(raw.strip('<>').split('#',1)[0].split('?',1)[0])
              if not val or val.startswith('/') or re.match(r'^[a-zA-Z][a-zA-Z0-9+.-]*:',val): return None
              return posixpath.normpath(posixpath.join(posixpath.dirname(path),val))
          for line in raw.split(b'\n'):
              if not line: continue
              parts=line.split(b'\0',2)
              assert len(parts)==3 and parts[1].isdigit(), 'C3_GREP_FORMAT'
              loc=parts[0].decode()
              assert loc.startswith(head+':')
              p=loc[len(head)+1:]
              if p in mirrors: continue
              s=parts[2].decode('utf-8','replace')
              direct=sorted(x for x in mirrors if x in s)
              relative=sorted({t for m in linkpat.finditer(s) if (t:=target(p,m.group(1) or m.group(2))) in mirrors})
              category='code_or_config' if p.endswith(('.py','.ps1','.sh','.bat','.cmd','.yml','.yaml','.toml','.ini','.json')) else 'doc_or_other'
              matches.append(dict(path=p,line=int(parts[1]),category=category,direct=direct,relative=relative))
              counts[category]+=1
          gaps=[]
          for p in selected:
              if not p.endswith('.md'): continue
              for i,s in enumerate(entries['current/'+p].decode().splitlines(),1):
                  for m in linkpat.finditer(s):
                      t=target(p,m.group(1) or m.group(2))
                      if t and t not in selected:
                          gaps.append(dict(path=p,line=i,target=t,kind='mirror' if t in mirrors else 'outside_export' if t in tree or any(k.startswith(t.rstrip('/')+'/') for k in tree) else 'missing_in_tree'))
          report=dict(status='CANDIDATE_EXPORT_DEPENDENCY_REVIEW_PENDING',source_commit=head,inventory=rows,current_count=len(selected),historical_count=11,files=files,reference_candidates=matches,reference_counts=dict(counts),link_gaps=gaps,limitations=['Pinned checkout: historical source pins cross-checked separately by GPT via GitHub trees; historical export bytes verified from mirror blobs.','Literal text search only, dynamic and external consumers not excluded.','Not Kimi retrieval, dependency closure, full secret audit or cold restore. No deletion or Skill disable permission.'])
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'c3-knowledge-audit'
