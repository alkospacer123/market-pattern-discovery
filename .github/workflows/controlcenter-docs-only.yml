          zpath=out/'C33_Knowledge_Export.zip'
          with zipfile.ZipFile(zpath,'x',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for name,data in sorted(entries.items()):
                  zi=zipfile.ZipInfo(name,(2026,11,27,0,0,0)); zi.compress_type=zipfile.ZIP_DEFLATED
                  z.writestr(zi,data)
          with zipfile.ZipFile(zpath) as z:
              assert z.testzip() is None and set(z.namelist())==set(entries)
              assert all(z.read(n)==d for n,d in entries.items())
          (out/'EXPORT_MANIFEST.json').write_bytes(manifest)
          digest=hashlib.sha256(zpath.read_bytes()).hexdigest()
          (out/'SHA256SUMS.txt').write_text(digest+'  '+zpath.name+'\n',encoding='ascii')
          print('C3_EXPORT_BYTE_VERIFIED',digest,'current',len(selected),'historical',11,'mirrors',len(rows),'reference_candidates',len(matches),'link_gaps',len(gaps))
          print('C3_REFERENCE_COUNTS',json.dumps(dict(counts)))
