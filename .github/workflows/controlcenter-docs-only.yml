              'recovery/kimi/memory/ControlCenter/Trading_Systems_Architecture_and_AI_Collaboration.md':('66325ca5e9264bf449cc73e9a6bfc2bd42a16db0','ddc333b21c73e6dc6f841231113c9d844dc665a6','recovery/kimi/Trading_Systems_Architecture_and_AI_Collaboration.md'),
              'recovery/kimi/memory/ControlCenter/PROJECT_PASSPORT_CONTROL_CENTER.md':('61a7d34758fd372331d1d3d0049f9fbe8e3a9541','61a7d34758fd372331d1d3d0049f9fbe8e3a9541','recovery/PROJECT_PASSPORT_CONTROL_CENTER.md'),
              'recovery/kimi/memory/ControlCenter/CONTROL_CENTER.md':('3c6ce463cad187a9e03d4d0fec68ee9e27310a50','3c6ce463cad187a9e03d4d0fec68ee9e27310a50','recovery/kimi/CONTROL_CENTER.md'),
              'recovery/kimi/memory/ControlCenter/V20_START_HERE_SOURCE_MAP.md':('2722096dfc2f8f404d31e9bed1efeac2ac932bfb','2722096dfc2f8f404d31e9bed1efeac2ac932bfb','ControlCenter/docs/V20_START_HERE_SOURCE_MAP.md'),
              'recovery/kimi/memory/ControlCenter/V20_CC08_OPERATIONS.md':('18be465651d3747abe99f669967e374cde616252','18be465651d3747abe99f669967e374cde616252','ControlCenter/docs/V20_CC08_OPERATIONS.md'),
              'recovery/kimi/memory/ControlCenter/V20_CC07_COMMAND_CONTRACT.md':('729649f0fe60fe8cac7cf29cd281ce1dd28276c2','729649f0fe60fe8cac7cf29cd281ce1dd28276c2','ControlCenter/docs/V20_CC07_COMMAND_CONTRACT.md'),
              'recovery/kimi/memory/ControlCenter/skills/cc-incident-audit/SKILL.md':('4ba0b325dd6ba7ee6129a3316b8313ea9fd7835d','4ba0b325dd6ba7ee6129a3316b8313ea9fd7835d','recovery/kimi/skills/cc-incident-audit/SKILL.md'),
              'recovery/kimi/memory/ControlCenter/skills/github-source-audit/SKILL.md':('320f3b558cee14b195ae0e8beb6ad392106f9359','320f3b558cee14b195ae0e8beb6ad392106f9359','recovery/kimi/skills/github-source-audit/SKILL.md'),
              'recovery/kimi/memory/ControlCenter/skills/ai-engineering-handoff/SKILL.md':('d08ccc90065b19a8abff75646b64dd0318688bd9','d08ccc90065b19a8abff75646b64dd0318688bd9','recovery/kimi/skills/ai-engineering-handoff/SKILL.md'),
