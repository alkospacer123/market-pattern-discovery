              'recovery/kimi/memory/TRL/PROJECT_PASSPORT_TRL.md':('1d51b98e1fce01302e5b3e26de5825bcf038af74','1d51b98e1fce01302e5b3e26de5825bcf038af74','recovery/PROJECT_PASSPORT_TRL.md'),
              'recovery/kimi/memory/TRL/TRL.md':('d8fc1f8e4286c6aeb50461f7a757cecc0a46a426','d8fc1f8e4286c6aeb50461f7a757cecc0a46a426','recovery/kimi/TRL.md'),
              'recovery/kimi/memory/TRL/TRL-NOV-2026-KIMI-START-HERE.md':('b0e316134eea8a2c62a6a2ae66dc282093fdbabe','b0e316134eea8a2c62a6a2ae66dc282093fdbabe','TradingResearchLab/reports/TRL-NOV-2026-KIMI-START-HERE.md'),
              'recovery/kimi/memory/TRL/RESEARCH_METHODOLOGY.md':('a4a116693634eef034e2a30ad4162df0f860ecf9','a4a116693634eef034e2a30ad4162df0f860ecf9','TradingResearchLab/research/RESEARCH_METHODOLOGY.md'),
              'recovery/kimi/memory/TRL/OPERATING_CYCLE.md':('edcb49586d03f20ea3e3ef47e70fceb831e2fa52','edcb49586d03f20ea3e3ef47e70fceb831e2fa52','TradingResearchLab/OPERATING_CYCLE.md'),
              'recovery/kimi/memory/TRL/RESEARCH_CARD_TEMPLATE.md':('d7beaf6bfc6516047df91d1419585b1b0c45e796','d7beaf6bfc6516047df91d1419585b1b0c45e796','TradingResearchLab/research/RESEARCH_CARD_TEMPLATE.md'),
              'recovery/kimi/memory/TRL/TRL-NOV-2026-ARTIFACT-MANIFEST.md':('725da79a35484a7385a8f9b98c3d7c59bc4e19e3','725da79a35484a7385a8f9b98c3d7c59bc4e19e3','TradingResearchLab/reports/TRL-NOV-2026-ARTIFACT-MANIFEST.md'),
              'recovery/kimi/memory/TRL/TRL-NOV-2026-FINAL-CLOSEOUT.md':('ec06839fd233f9909eead53e82b9b7d1d7868fb8','ec06839fd233f9909eead53e82b9b7d1d7868fb8','TradingResearchLab/reports/TRL-NOV-2026-FINAL-CLOSEOUT.md'),
              'recovery/kimi/memory/TRL/skills/trl-repro-review/SKILL.md':('9f0f1af3516e6eb6af48d7c434355150544e1476','9f0f1af3516e6eb6af48d7c434355150544e1476','recovery/kimi/skills/trl-repro-review/SKILL.md'),
              'recovery/kimi/memory/TRL/skills/github-source-audit/SKILL.md':('320f3b558cee14b195ae0e8beb6ad392106f9359','320f3b558cee14b195ae0e8beb6ad392106f9359','recovery/kimi/skills/github-source-audit/SKILL.md'),
              'recovery/kimi/memory/TRL/skills/ai-engineering-handoff/SKILL.md':('d08ccc90065b19a8abff75646b64dd0318688bd9','d08ccc90065b19a8abff75646b64dd0318688bd9','recovery/kimi/skills/ai-engineering-handoff/SKILL.md'),
          }
          assert len(c3_retire)==29
          c3_indexes={f'recovery/kimi/memory/{p}/{n}' for p in ('V20','ControlCenter','TRL') for n in ('README.md','MANIFEST.json')}|{'recovery/kimi/memory/README.md'}
          c3_reviewed='b50817d948b5503765117e8ab2b51793ee272dbd'
          assert doc_allowed('ControlCenter/STATUS.md')
          assert doc_allowed('ControlCenter/JOURNAL.md')
          assert not doc_allowed('ControlCenter/OTHER_JOURNAL.md')
          assert doc_allowed('ControlCenter/README.md')
          assert doc_allowed('ControlCenter/docs/V20_SAFE_TEST.md')
          assert doc_allowed('ControlCenter/docs/SECURITY_BOUNDARY.md')
          assert not doc_allowed('ControlCenter/controller/operator.py')
          assert not doc_allowed('ControlCenter/ci/scope_audit.py')
          assert not doc_allowed('ControlCenter/docs/CC03_MANUAL_OS_SOURCE.md')
          assert not doc_allowed('ControlCenter/cc/v20_contract.py')
          assert not doc_allowed('ControlCenter/docs/ANYTHING.txt')

          def objects(ref):
              out={}
              raw=subprocess.check_output(('git','ls-tree','-r','-z',ref))
              for el in raw.split(b'\0'):
                  if not el: continue
                  info,path=el.split(b'\t',1)
                  mode,kind,sha=info.decode().split()
                  out[path.decode()]=(mode,kind,sha)
              return out

          def regular_doc(entry):
              return entry is not None and entry[:2]==('100644','blob')

          def cc_objects(tree):
              return {p:v for p,v in tree.items() if p.startswith('ControlCenter/')}

          def delta(left,right):
              return {p for p in left.keys()|right.keys() if left.get(p)!=right.get(p)}

          def validate_frozen(frozen_files,candidate_files):
              cc_delta=delta(frozen_files,candidate_files)
              invalid={p for p in cc_delta if (not doc_allowed(p) and p not in active_source) or not regular_doc(candidate_files.get(p))}
              assert not invalid, ('CC_SEALED_SOURCE_OR_HISTORICAL_DOC_CHANGED', sorted(invalid))
              return cc_delta

          def validate_scope(changed,cc_pr_delta,candidate,cleanup_base=None,reviewed=None,ancestor=False):
              assert changed, 'CC_DOCS_NO_CHANGES'
              deleted={p for p,s in changed.items() if s=='D'}
              if deleted:
                  assert deleted==set(c3_retire) and cleanup_base is not None and reviewed is not None and ancestor, 'CC_DOCS_DELETION_OR_RENAME_FORBIDDEN: exact C3 retirement only'
                  assert c3_indexes.issubset(changed) and all(changed[p]=='M' for p in c3_indexes), 'CC_C3_INDEX_TRANSITION_REQUIRED'
                  for p,(old,prior,source) in c3_retire.items():
                      assert cleanup_base.get(p)==('100644','blob',old) and reviewed.get(p)==('100644','blob',prior), 'CC_C3_RETIRE_IDENTITY:'+p
                      assert p not in candidate and regular_doc(candidate.get(source)), 'CC_C3_RETAIN_SOURCE:'+p
              for path,status in changed.items():
                  if path in deleted: continue
                  assert status in ('A','M'), 'CC_DOCS_DELETION_OR_RENAME_FORBIDDEN:'+path
                  assert regular_doc(candidate.get(path)), 'CC_DOCS_NOT_REGULAR_BLOB:'+path
              paths=set(changed)
              if paths & (workflows|{admission}):
                  if admission in paths:
                      assert paths==ci_pair, 'CC_DOCS_CI_PAIR_SCOPE'
                  else:
                      assert paths.issubset(workflows), 'CC_DOCS_WORKFLOW_AND_DOCUMENTS_MIXED'
                  assert not cc_pr_delta, 'CC_SOURCE_CHANGED_DURING_CI_CHANGE'
                  return 'CI_ONLY'
              cc_changed={p for p in paths if p.startswith('ControlCenter/')}
              assert cc_changed==cc_pr_delta and cc_changed, ('CC_DOCS_DIFF_NOT_EXACT',sorted(cc_changed^cc_pr_delta))
              if cc_changed & active_source:
                  assert paths==cc_changed, 'CC_ACTIVE_SOURCE_CROSS_PROJECT_FORBIDDEN'
                  assert all(doc_allowed(p) or p in active_source for p in cc_changed), 'CC_ACTIVE_SOURCE_WRONG_PATH'
                  assert all(changed[p]=='M' for p in cc_changed & active_source), 'CC_ACTIVE_SOURCE_NOT_MODIFICATION'
                  return 'CC_ACTIVE_SOURCE'
              assert all(doc_allowed(p) for p in cc_changed), 'CC_DOCS_WRONG_CC_PATH'
              if paths-cc_changed:
                  assert (paths-deleted).issubset(cross_project_docs), ('CC_DOCS_WRONG_PATH',sorted(paths-deleted-cross_project_docs))
                  return 'C3_EXACT_MIRROR_RETIREMENT' if deleted else 'CROSS_PROJECT_COC_DOCS'
              return 'CC_ONLY'

          # Calibrate the same predicates used below with harmless synthetic tree entries.
          normal=('100644','blob','synthetic')
          link=('120000','blob','synthetic')
          cc_doc='ControlCenter/docs/V20_CC07_COMMAND_CONTRACT.md'
          contract='recovery/CRITICAL_OPERATIONS_CONTRACT.md'
          runtime='ControlCenter/v20_admin_control.py'
          cc03='ControlCenter/docs/CC03_MANUAL_OS_SOURCE.md'
          def scope_fixture(paths,cc_paths,expected):
              assert validate_scope({p:'M' for p in paths},set(cc_paths),{p:normal for p in paths})==expected
          def must_reject(fn,code):
              try:
                  fn()
              except AssertionError as exc:
                  assert code in str(exc), ('CC_NEGATIVE_WRONG_GATE',code,str(exc))
              else:
                  raise AssertionError('CC_NEGATIVE_ACCEPTED:'+code)
          scope_fixture({cc_doc},{cc_doc},'CC_ONLY')
          scope_fixture(coc_paths,{p for p in coc_paths if p.startswith('ControlCenter/')},'CROSS_PROJECT_COC_DOCS')
          c3_cc={'ControlCenter/STATUS.md','ControlCenter/JOURNAL.md'}
          c3_fixture=c3_paths|{'AGENTS.md','recovery/kimi/EXAM_AND_HANDOFF.md','recovery/kimi/README.md'}
          assert validate_scope({p:('A' if p in c3_cc else 'M') for p in c3_fixture},c3_cc,{p:normal for p in c3_fixture})=='CROSS_PROJECT_COC_DOCS'
          assert validate_frozen({runtime:normal},{runtime:normal,**{p:normal for p in c3_cc}})==c3_cc
          for p in c3_cc:
              must_reject(lambda: validate_scope({p:'D'},{p},{}),'CC_DOCS_DELETION')
              must_reject(lambda: validate_scope({p:'A'},{p},{p:link}),'CC_DOCS_NOT_REGULAR_BLOB')
              must_reject(lambda: validate_frozen({},{p:link}),'CC_SEALED_SOURCE')
          unreviewed='recovery/kimi/memory/unreviewed.md'
          must_reject(lambda: validate_scope({**{p:'M' for p in c3_fixture},unreviewed:'A'},c3_cc,{**{p:normal for p in c3_fixture},unreviewed:normal}),'CC_DOCS_WRONG_PATH')
          must_reject(lambda: validate_scope({**{p:'M' for p in c3_fixture},runtime:'M'},c3_cc|{runtime},{**{p:normal for p in c3_fixture},runtime:normal}),'CC_DOCS_WRONG_CC_PATH')
          scope_fixture(ci_pair,set(),'CI_ONLY')
          scope_fixture(workflows,set(),'CI_ONLY')
          scope_fixture(active_source|{cc_doc},active_source|{cc_doc},'CC_ACTIVE_SOURCE')
          assert validate_frozen({p:normal for p in active_source},{p:('100644','blob','changed') for p in active_source})==active_source
          must_reject(lambda: validate_scope({p:'M' for p in active_source|{contract}},active_source,{p:normal for p in active_source|{contract}}),'CC_ACTIVE_SOURCE_CROSS_PROJECT_FORBIDDEN')
          must_reject(lambda: validate_scope({p:'M' for p in active_source|{runtime}},active_source|{runtime},{p:normal for p in active_source|{runtime}}),'CC_ACTIVE_SOURCE_WRONG_PATH')
          must_reject(lambda: validate_frozen({p:normal for p in active_source},{}),'CC_SEALED_SOURCE')
          assert validate_frozen({runtime:normal},{runtime:normal,cc_doc:normal})=={cc_doc}
          must_reject(lambda: validate_frozen({runtime:normal},{runtime:('100644','blob','changed')}),'CC_SEALED_SOURCE')
          must_reject(lambda: validate_frozen({cc03:normal},{cc03:('100644','blob','changed')}),'CC_SEALED_SOURCE')
          must_reject(lambda: validate_frozen({cc_doc:normal},{}),'CC_SEALED_SOURCE')
          must_reject(lambda: validate_scope({cc_doc:'M',runtime:'M'},{cc_doc,runtime},{cc_doc:normal,runtime:normal}),'CC_DOCS_WRONG_CC_PATH')
          must_reject(lambda: validate_scope({cc_doc:'M','recovery/unreviewed.md':'A'},{cc_doc},{cc_doc:normal,'recovery/unreviewed.md':normal}),'CC_DOCS_WRONG_PATH')
          must_reject(lambda: validate_scope({cc_doc:'M','V20_TradingSystem_M15/v20_runtime/finam_live.py':'M'},{cc_doc},{cc_doc:normal,'V20_TradingSystem_M15/v20_runtime/finam_live.py':normal}),'CC_DOCS_WRONG_PATH')
          must_reject(lambda: validate_scope({cc_doc:'D'},{cc_doc},{cc_doc:normal}),'CC_DOCS_DELETION')
          must_reject(lambda: validate_scope({cc_doc:'R'},{cc_doc},{cc_doc:normal}),'CC_DOCS_DELETION')
          must_reject(lambda: validate_scope({cc_doc:'M',contract:'A'},{cc_doc},{cc_doc:normal,contract:link}),'CC_DOCS_NOT_REGULAR_BLOB')
          must_reject(lambda: validate_scope({cc_doc:'M'},{cc_doc},{cc_doc:link}),'CC_DOCS_NOT_REGULAR_BLOB')
          must_reject(lambda: validate_scope({cc_doc:'M'},set(),{cc_doc:normal}),'CC_DOCS_DIFF_NOT_EXACT')
          must_reject(lambda: validate_scope({p:'M' for p in ci_pair|{cc_doc}},{cc_doc},{p:normal for p in ci_pair|{cc_doc}}),'CC_DOCS_CI_PAIR_SCOPE')
          must_reject(lambda: validate_scope({p:'M' for p in ci_pair},{cc_doc},{p:normal for p in ci_pair}),'CC_SOURCE_CHANGED_DURING_CI_CHANGE')
          must_reject(lambda: validate_scope({admission:'M'},set(),{admission:normal}),'CC_DOCS_CI_PAIR_SCOPE')
          must_reject(lambda: validate_scope({cc_doc:'M','.github/workflows/controlcenter-docs-only.yml':'M'},{cc_doc},{cc_doc:normal,'.github/workflows/controlcenter-docs-only.yml':normal}),'CC_DOCS_WORKFLOW_AND_DOCUMENTS_MIXED')

          # Final scope tests use the same predicate; unrelated/partial deletes fail closed.
          final_fixture=c3_final_paths|{cc_doc}
          scope_fixture(final_fixture,{p for p in final_fixture if p.startswith('ControlCenter/')},'CROSS_PROJECT_COC_DOCS')
          retirement_changes={**{p:'D' for p in c3_retire},**{p:'M' for p in c3_indexes},cc_doc:'M'}
          retirement_base={p:('100644','blob',x[0]) for p,x in c3_retire.items()}
          retirement_reviewed={p:('100644','blob',x[1]) for p,x in c3_retire.items()}
          retirement_candidate={p:normal for p in c3_indexes|{cc_doc}|{x[2] for x in c3_retire.values()}}
          assert validate_scope(retirement_changes,{cc_doc},retirement_candidate,retirement_base,retirement_reviewed,True)=='C3_EXACT_MIRROR_RETIREMENT'
          first=next(iter(c3_retire))
          must_reject(lambda: validate_scope({p:s for p,s in retirement_changes.items() if p!=first},{cc_doc},retirement_candidate,retirement_base,retirement_reviewed,True),'CC_DOCS_DELETION')
          must_reject(lambda: validate_scope({**retirement_changes,'recovery/kimi/skills/v20-safety-analysis/SKILL.md':'D'},{cc_doc},retirement_candidate,retirement_base,retirement_reviewed,True),'CC_DOCS_DELETION')
          must_reject(lambda: validate_scope(retirement_changes,{cc_doc},retirement_candidate,retirement_base,retirement_reviewed,False),'CC_DOCS_DELETION')
          must_reject(lambda: validate_scope(retirement_changes,{cc_doc},retirement_candidate,{},retirement_reviewed,True),'CC_C3_RETIRE_IDENTITY')
          must_reject(lambda: validate_scope(retirement_changes,{cc_doc},{p:v for p,v in retirement_candidate.items() if p!=c3_retire[first][2]},retirement_base,retirement_reviewed,True),'CC_C3_RETAIN_SOURCE')

          # Two independent checks: frozen source protection (cumulative) and exact PR delta.
          frozen_files=cc_objects(objects(frozen))
          base_files=objects(base)
          candidate=objects(head)
          candidate_files=cc_objects(candidate)
          cc_delta=validate_frozen(frozen_files,candidate_files)
          cc_pr_delta=delta(cc_objects(base_files),candidate_files)
          changed={}
          raw=subprocess.check_output(('git','diff','--name-status','--no-renames','-z',base,head)).split(b'\0')
          assert raw[-1]==b'' and (len(raw)-1)%2==0, 'CC_DOCS_DIFF_PARSE'
          for i in range(0,len(raw)-1,2):
              status,path=raw[i].decode('ascii'),raw[i+1].decode('utf-8')
              assert path not in changed, 'CC_DOCS_DUPLICATE_PATH:'+path
              changed[path]=status
          assert set(changed)==delta(base_files,candidate), 'CC_DOCS_FULL_DIFF_NOT_EXACT'
          deleting=any(s=='D' for s in changed.values())
          ancestor=deleting and subprocess.run(('git','merge-base','--is-ancestor',c3_reviewed,head),check=False).returncode==0
          scope=validate_scope(changed,cc_pr_delta,candidate,base_files,objects(c3_reviewed) if ancestor else None,ancestor)

          # Read pinned Git blobs, not sparse working-tree files; cross-project docs stay checked.
          allpaths={p for p,e in candidate.items() if e[1]=='blob' and e[0] in ('100644','100755')}
          # Only this reviewed directory locator is accepted in addition to regular blobs.
          # Require at least one real tracked regular file below it, not a symlink/gitlink.
          def valid_doc_link(dest,paths):
              return dest in paths or (dest=='TradingResearchLab/journal' and any(p.startswith(dest+'/') for p in paths))
          assert valid_doc_link('TradingResearchLab/journal',{'TradingResearchLab/journal/entry.md'})
          assert not valid_doc_link('TradingResearchLab/journal',{'TradingResearchLab/journal-other/entry.md'})
          assert not valid_doc_link('recovery/kimi',{'recovery/kimi/README.md'})
          assert not valid_doc_link('TradingResearchLab/journal/missing.md',{'TradingResearchLab/journal/entry.md'})
          linkcount=0
          bad=re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----|github_pat_[A-Za-z0-9_]{30,}|ghp_[A-Za-z0-9]{30,}|Authorization:\s*Bearer\s+[A-Za-z0-9_-]{35,}',re.I)
          for path in changed:
              if changed[path]=='D' or not path.endswith(('.md','.json')): continue
              content=git('show',f'{head}:{path}')
              if path.endswith('.md'):
                  for m in re.finditer(r'\]\(([^)]+)\)',content):
                      href=m.group(1).strip().split('#')[0]
                      if not href or re.match(r'^(https?://|mailto:|data:)',href,re.I): continue
                      if ' ' in href: continue
                      dest=posixpath.normpath(posixpath.join(posixpath.dirname(path),href))
                      assert valid_doc_link(dest,allpaths), ('CC_DOCS_BROKEN_LINK',path,dest)
                      linkcount+=1
              assert not bad.search(content), 'CC_DOCS_POSSIBLE_SECRET:'+path

          print('CC_DOCS_SCOPE_MODE='+scope)
          print('CC_CUMULATIVE_ALLOWED_DELTA',len(cc_delta))
          print('CC_PR_DOCUMENTATION_DELTA',len(cc_pr_delta))
          print('CC_FROZEN_ORIGINAL_SOURCE=PASS',frozen,os.environ['FROZEN_CC_TREE'])
          print('CC_NON_ACTIVE_RUNTIME_AND_CC03_BLOB_IDENTITIES=UNCHANGED')
          print('CC_CHANGE_SCOPE=PASS',len(cc_pr_delta))
          print('CC_MODIFIED_DOCUMENT_LINKS=PASS',linkcount)
          print('CC_NEGATIVE_SCOPE_TESTS=PASS')
          print('CC_DOCS_SOURCE_NOT_FINAM_NOT_LIVE=PASS')
          print('CC03_FROZEN_NATIVE_IS_SEPARATE_HISTORIC_GATE_NOT_RUN_IN_THIS_JOB')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as out:
              out.write('mode='+scope+'\n')
          PY

  cc-active-source-native:
    name: CC current SOURCE Windows native tests (no release or LIVE)
    needs: cc-documents-no-live
    if: needs.cc-documents-no-live.outputs.scope == 'CC_ACTIVE_SOURCE' || needs.cc-documents-no-live.outputs.scope == 'CI_ONLY'
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
        working-directory: ControlCenter
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      STREAMLIT_SERVER_HEADLESS: 'true'
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: 'false'
    steps:
      - name: Checkout exact current PR head (no credentials)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /ControlCenter/
          sparse-checkout-cone-mode: false
      - name: Windows CPython 3.12.10 x64
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          architecture: x64
      - name: Verify exact current head and install historical hash-locked test dependencies
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_ENVIRONMENT -ne 'github-hosted'){throw 'CC_ACTIVE_NOT_HOSTED'}
          if((& git.exe rev-parse HEAD).Trim() -cne $env:PR_HEAD){throw 'CC_ACTIVE_WRONG_HEAD'}
          if((& git.exe rev-parse HEAD:ControlCenter/deployment/manifest.json).Trim() -cne '7cd99f68f930f64ef74f17d50f6510fcd7f96691'){throw 'CC_HISTORIC_MANIFEST_CHANGED'}
          python -m venv "$env:RUNNER_TEMP\cc-active-python"
          if($LASTEXITCODE -ne 0){throw 'CC_ACTIVE_VENV_FAILED'}
          $python="$env:RUNNER_TEMP\cc-active-python\Scripts\python.exe"
          & $python -m pip install --require-hashes --only-binary=:all: --no-deps -r requirements-windows-ci.lock
          if($LASTEXITCODE -ne 0){throw 'CC_ACTIVE_WHEELS_FAILED'}
          & $python -m pip check
          if($LASTEXITCODE -ne 0){throw 'CC_ACTIVE_PIP_CHECK_FAILED'}
      - name: Current full offline test suite, native cases and exact JUnit evidence
        run: |
          $ErrorActionPreference='Stop'
          $python="$env:RUNNER_TEMP\cc-active-python\Scripts\python.exe"
          $env:CC03_CI_DISPOSABLE_ROOT=Join-Path $env:RUNNER_TEMP ('CC03-'+[guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $env:CC03_CI_DISPOSABLE_ROOT | Out-Null
          $evidence=Join-Path $env:RUNNER_TEMP 'cc03-evidence'
          New-Item -ItemType Directory -Path $evidence | Out-Null
          & git.exe rev-parse HEAD | Set-Content -LiteralPath (Join-Path $evidence 'head.txt') -Encoding utf8
          & $python -B -m pytest -q -p no:cacheprovider "--junitxml=$evidence/full-suite.xml" tests
          if($LASTEXITCODE -ne 0){throw 'CC_ACTIVE_TESTS_FAILED'}
          $audit=@'
          import os, pathlib, xml.etree.ElementTree as ET
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'cc03-evidence'
          cases=list(ET.parse(root/'full-suite.xml').iter('testcase'))
          targeted=[c for c in cases if 'test_v20_control_center' in c.get('classname','')]
          assert len(targeted)>=38, 'CC_ACTIVE_V20_TEST_COUNT_TOO_SMALL'
          assert all(c.find('skipped') is None for c in targeted), 'CC_ACTIVE_V20_TEST_SKIPPED'
          passed=0
          for c in cases:
              assert c.find('failure') is None and c.find('error') is None, 'CC_ACTIVE_TEST_FAILURE'
              skip=c.find('skipped')
              if skip is not None:
                  assert (skip.get('message') or '').startswith('POSIX descriptor fault injection;'), 'CC_ACTIVE_UNAPPROVED_SKIP:'+str(c.attrib)
              else:
                  passed+=1
          assert passed>=700, 'CC_ACTIVE_NATIVE_INSUFFICIENT_COVERAGE'
          print('CC_ACTIVE_SOURCE_NATIVE_PASS',passed,'V20 targeted',len(targeted))
          print('CC_ACTIVE_SOURCE_NOT_CC03_PACKAGE_NOT_INSTALLED_NOT_LIVE')
          '@
          $audit | & $python -B -
          if($LASTEXITCODE -ne 0){throw 'CC_ACTIVE_EVIDENCE_FAILED'}
      - name: Preserve current SOURCE evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cc-active-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cc03-evidence/
          if-no-files-found: error
          retention-days: 30

