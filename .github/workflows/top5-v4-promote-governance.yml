name: Top5 V4 promote governance fix
on:
  push:
    branches: [top5-v4-runtime-temp]
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch to working V4 branch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/patch.b64 <<'EOF'

EOF
          base64 -d /tmp/patch.b64 | gzip -dc > /tmp/apply_top5_v4_governance.py
          git fetch origin top5-contract-fix-v4
          git checkout -B top5-contract-fix-v4 origin/top5-contract-fix-v4
          python /tmp/apply_top5_v4_governance.py
      - name: Compile and run complete V4 test suite
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m compileall -q src scripts
          PYTHONPATH=src pytest -q tests/test_top5_v4_engine.py tests/test_top5_v4_state_machines.py tests/test_top5_v4_governance.py tests/test_top5_v4_freeze_integrity.py
      - name: Commit and push only after PASS
        shell: bash
        run: |
          set -euo pipefail
          git config user.name alkospacer123
          git config user.email alkospacer123@gmail.com
          git add config/top5_v4/strategy_contract.json src/market_pattern_discovery/backtest/top5_v4/freeze.py scripts/run_top5.py tests/test_top5_v4_freeze_integrity.py
          git diff --cached --check
          git commit -m "Harden V4 freeze and validation provenance"
          git push origin HEAD:top5-contract-fix-v4
